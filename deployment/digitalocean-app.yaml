name: podtoolbox
region: nyc
static_sites:
  - name: podtoolbox-web
    github:
      repo: mildsdixon/podtoolbox
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_SUPABASE_URL
        value: https://ejohdpgojcidqmohlcyp.supabase.co
        scope: BUILD_TIME
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_mHV39RdNQEeNPpaj0eGObA_cUVqcXv2
        scope: BUILD_TIME
services:
  - name: podtoolbox-media
    github:
      repo: mildsdixon/podtoolbox
      branch: main
      deploy_on_push: true
    source_dir: /
    run_command: npm run media
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    envs:
      - key: HOST
        value: 0.0.0.0
        scope: RUN_TIME
      - key: PODCLIPZ_MEDIA_PORT
        value: "8080"
        scope: RUN_TIME
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: podtoolbox-media
    - match:
        path:
          prefix: /exports
      component:
        name: podtoolbox-media
    - match:
        path:
          prefix: /conversions
      component:
        name: podtoolbox-media
    - match:
        path:
          prefix: /
      component:
        name: podtoolbox-web
domains:
  - domain: podtoolbox.net
    type: PRIMARY
  - domain: www.podtoolbox.net
    type: ALIAS
